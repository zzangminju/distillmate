services:
  - type: web
    name: distillmate-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      - key: OPENAI_MODEL
        value: gpt-4.1-mini

      - key: OPENAI_API_KEY
        sync: false

      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      - key: ALLOWED_ORIGINS
        sync: false